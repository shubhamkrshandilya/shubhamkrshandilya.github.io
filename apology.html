<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>A Personal Note</title>

  <!-- Umami Analytics -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="51099ff8-0148-45cc-bfd0-6649a7357166"></script>
  
  <!-- Premium Elegant Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- p5.js Creative Coding Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  
  <style>
    /* CSS Variables & Design System */
    :root {
      --bg-dark: #0b0d17;
      --card-bg: rgba(22, 25, 43, 0.75);
      --card-border: rgba(255, 182, 193, 0.2);
      --accent-rose: #ff758c;
      --accent-glow: #ff7eb3;
      --accent-gold: #f7d070;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-body: 'Lora', Georgia, serif;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
      --font-cursive: 'Great Vibes', cursive;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Ambient Background Glow */
    .bg-glow-blob {
      position: fixed;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
      animation: pulseGlow 10s infinite alternate ease-in-out;
    }
    .blob-1 { top: -100px; left: -100px; background: radial-gradient(circle, #ff758c, #7928ca); }
    .blob-2 { bottom: -100px; right: -100px; background: radial-gradient(circle, #ff7eb3, #ff416c); }

    @keyframes pulseGlow {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.15) translate(30px, 30px); }
    }

    /* Particles Canvas */
    #ambient-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* Locked Passcode Container */
    .envelope-wrapper {
      perspective: 1000px;
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .envelope-container {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 3rem 2.25rem 2.5rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(247, 208, 112, 0.15);
      text-align: center;
      transition: all 0.6s ease;
      position: relative;
    }

    .wax-seal {
      width: 76px;
      height: 76px;
      background: linear-gradient(135deg, #ff758c, #f7d070);
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(255, 117, 140, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.4);
      cursor: pointer;
      transition: all 0.4s ease;
      border: 3px solid rgba(255, 255, 255, 0.6);
    }

    .seal-icon {
      font-size: 2.2rem;
    }

    .wax-seal:hover {
      transform: scale(1.08) rotate(6deg);
      box-shadow: 0 15px 35px rgba(247, 208, 112, 0.6);
    }

    .wax-seal.seal-open {
      animation: sealBreak 0.7s ease forwards;
    }

    @keyframes sealBreak {
      0% { transform: scale(1); }
      50% { transform: scale(1.3) rotate(20deg); opacity: 0.8; }
      100% { transform: scale(0); opacity: 0; }
    }

    @keyframes floatHeart {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    .locked-title {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff, #ff7eb3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .locked-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
      line-height: 1.5;
    }

    .input-group {
      position: relative;
      margin-bottom: 1.25rem;
    }

    .passcode-input {
      width: 100%;
      padding: 1rem 1.25rem;
      background: rgba(15, 18, 33, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
      text-align: center;
      letter-spacing: 1px;
    }

    .passcode-input:focus {
      border-color: var(--accent-rose);
      box-shadow: 0 0 15px rgba(255, 117, 140, 0.4);
    }

    .btn-primary {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 117, 140, 0.4);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(255, 117, 140, 0.6);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .error-msg {
      margin-top: 1rem;
      font-size: 0.875rem;
      color: #ff4d6d;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    /* Shake Animation for Wrong Password */
    .shake {
      animation: shakeAnim 0.4s ease-in-out;
    }

    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }

    /* Unlocked Main Container */
    #unlocked-screen {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 760px;
      padding: 2rem 1.5rem;
      display: none;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .unlocked-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 3rem 2.5rem;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 40px rgba(255, 117, 140, 0.15);
    }

    .hero-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .heart-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1.25rem;
      background: rgba(255, 117, 140, 0.15);
      border: 1px solid rgba(255, 117, 140, 0.3);
      border-radius: 50px;
      font-size: 0.875rem;
      color: var(--accent-rose);
      margin-bottom: 1.25rem;
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: 3.1rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #ffffff, #f7d070, #ff7eb3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.25;
      letter-spacing: 0.5px;
    }

    .hero-subtitle {
      font-family: var(--font-sans);
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .letter-section {
      margin-bottom: 3rem;
    }

    .letter-card {
      background: rgba(15, 18, 33, 0.65);
      border: 1px solid rgba(255, 182, 193, 0.18);
      border-radius: 24px;
      padding: 2.75rem 2.25rem;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.3);
    }

    .quote-mark {
      position: absolute;
      top: -15px;
      left: 15px;
      font-size: 7rem;
      color: rgba(255, 117, 140, 0.12);
      font-family: var(--font-serif);
      pointer-events: none;
    }

    .letter-body {
      position: relative;
      z-index: 2;
    }

    .letter-paragraph {
      font-family: var(--font-body);
      font-size: 1.125rem;
      line-height: 2;
      color: #f1f5f9;
      margin-bottom: 1.35rem;
      letter-spacing: 0.25px;
      font-weight: 400;
    }

    .letter-signature {
      margin-top: 2.25rem;
      text-align: right;
    }

    .letter-signature span {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--text-muted);
      display: block;
      letter-spacing: 0.5px;
    }

    .signature-name {
      font-family: var(--font-cursive);
      font-size: 3rem;
      color: #f7d070;
      margin-top: 0.25rem;
      font-weight: 400;
      text-shadow: 0 0 15px rgba(247, 208, 112, 0.3);
    }

    .letter-divider {
      text-align: center;
      color: rgba(247, 208, 112, 0.4);
      font-size: 1.1rem;
      margin: 2rem 0 1rem;
      letter-spacing: 4px;
    }

    .memories-section {
      margin-bottom: 3rem;
    }

    .section-title {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 1.5rem;
      color: #fff;
    }

    .memory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1.25rem;
    }

    .memory-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 1.5rem;
      text-align: center;
      transition: all 0.3s ease;
    }

    .memory-card:hover {
      transform: translateY(-5px);
      background: rgba(255, 117, 140, 0.08);
      border-color: rgba(255, 117, 140, 0.3);
    }

    .memory-icon {
      font-size: 2rem;
      margin-bottom: 0.75rem;
    }

    .memory-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .memory-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .action-section {
      text-align: center;
      padding-top: 1rem;
    }

    .action-question {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      margin-bottom: 1.5rem;
      color: #fff;
    }

    .button-group {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn-secondary {
      padding: 1rem 1.75rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      color: var(--text-main);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .fade-in-element {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.9s ease, transform 0.9s ease;
    }
    .fade-in-element.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 640px) {
      .envelope-wrapper {
        max-width: 92%;
      }
      .envelope-container {
        padding: 2.25rem 1.5rem 2rem;
      }
      #unlocked-screen {
        padding: 1.25rem 0.75rem;
      }
      .unlocked-card {
        padding: 1.75rem 1.25rem;
        border-radius: 20px;
      }
      .hero-title {
        font-size: 2.25rem;
      }
      .letter-card {
        padding: 1.75rem 1.25rem;
        border-radius: 18px;
      }
      .letter-paragraph {
        font-size: 1.05rem;
        line-height: 1.85;
      }
      .signature-name {
        font-size: 2.5rem;
      }
      .quote-mark {
        font-size: 5rem;
        top: -10px;
        left: 10px;
      }
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.hidden {
      display: none;
      opacity: 0;
    }

    .modal-card {
      background: var(--bg-dark);
      border: 1px solid var(--accent-rose);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 0 50px rgba(255, 117, 140, 0.4);
      animation: modalPop 0.4s ease;
    }

    @keyframes modalPop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-icon { font-size: 3rem; margin-bottom: 1rem; }
    .modal-title { font-family: var(--font-serif); font-size: 1.75rem; margin-bottom: 0.75rem; color: #fff; }
    .modal-text { color: var(--text-muted); font-size: 1rem; line-height: 1.6; margin-bottom: 1.75rem; }

    .wish-section {
      text-align: center;
      margin-top: 2.25rem;
    }
    .btn-wish {
      padding: 0.85rem 1.75rem;
      background: linear-gradient(135deg, rgba(247, 208, 112, 0.15), rgba(255, 117, 140, 0.15));
      border: 1px solid rgba(247, 208, 112, 0.4);
      border-radius: 50px;
      color: #f7d070;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.4s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      box-shadow: 0 5px 20px rgba(247, 208, 112, 0.1);
    }
    .btn-wish:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 10px 25px rgba(247, 208, 112, 0.3);
      border-color: rgba(247, 208, 112, 0.7);
    }
    .candle-container {
      margin-top: 1.5rem;
      display: none;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .flame-wrapper {
      position: relative;
      width: 40px;
      height: 60px;
      margin: 0 auto 1rem;
    }
    .flame {
      width: 18px;
      height: 32px;
      background: linear-gradient(to top, #ff4500, #ffb703, #ffffff);
      border-radius: 50% 50% 35% 35%;
      margin: 0 auto;
      animation: flicker 1.2s infinite ease-in-out alternate;
      box-shadow: 0 0 20px #ffb703, 0 0 35px #ff758c;
    }
    .flame-glow {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, rgba(247, 208, 112, 0.4), transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: pulseGlow 2s infinite alternate ease-in-out;
    }
    @keyframes flicker {
      0% { transform: scale(1) rotate(-1deg); }
      100% { transform: scale(1.08) rotate(1deg); }
    }
    .wish-message {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      color: #f7d070;
      line-height: 1.6;
      max-width: 440px;
      margin: 0 auto;
      text-shadow: 0 0 15px rgba(247, 208, 112, 0.2);
    }

    @media (max-width: 600px) {
      .unlocked-card { padding: 2rem 1.25rem; }
      .hero-title { font-size: 2rem; }
      .letter-card { padding: 1.75rem 1.25rem; }
    }
  </style>
</head>
<body>

  <!-- Ambient Glow Background Blobs -->
  <div class="bg-glow-blob blob-1"></div>
  <div class="bg-glow-blob blob-2"></div>

  <!-- Particle Effect Canvas -->
  <canvas id="ambient-canvas"></canvas>

  <!-- LOCKED SCREEN: Dignified Minimal Entry -->
  <div id="locked-screen" class="envelope-wrapper">
    <div class="envelope-container" id="envelope">
      <div class="heart-badge" style="margin: 0 auto 1.25rem;">
        <span class="badge-icon">🌿</span>
        <span>A Personal Note</span>
      </div>
      <h1 class="locked-title" style="background: none; -webkit-text-fill-color: initial; color: #fff;">A Personal Note</h1>
      <p class="locked-subtitle">Just something I wanted to say properly.</p>
      
      <div class="input-group">
        <input type="password" id="passcode-input" class="passcode-input" placeholder="Enter passcode..." onkeyup="handleKeyPress(event)" autofocus>
      </div>
      
      <button class="btn-primary" onclick="unlockPage()" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); box-shadow: none;">
        <span>Read Note</span>
      </button>
      
      <div id="error-msg" class="error-msg">Incorrect passcode. Please try again.</div>
    </div>
  </div>

  <!-- UNLOCKED CONTAINER (Decrypted Dynamic HTML Render Target) -->
  <div id="unlocked-screen"></div>

  <script>
    /*
      ===================================================================
      AES-256-GCM Cryptographic Payload
      Derived using PBKDF2 (100,000 iterations, SHA-256)
      ===================================================================
    */
    const ENCRYPTED_PAYLOAD = {

    /* Ambient Particle System */
    const canvas = document.getElementById('ambient-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + Math.random() * 20;
        this.size = Math.random() * 3 + 1;
        this.speedY = Math.random() * 0.8 + 0.2;
        this.speedX = (Math.random() - 0.5) * 0.4;
        this.opacity = Math.random() * 0.4 + 0.1;
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        if (this.y < -10) this.reset();
      }
      draw() {
        ctx.fillStyle = `rgba(247, 208, 112, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 30; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /* Unlocked Particle & Sequential Fade-In Enhancements */
    function initUnlockedParticles() {
      for (let i = 0; i < 15; i++) {
        particles.push(new Particle());

    function triggerSequentialFadeIn() {

        setTimeout(() => {
          el.classList.add('visible');
        }, index * 220);
